<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Perbandingan LPLPO & LPLPO RI</title>
    <!-- Menggunakan Tailwind CSS untuk styling instan -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-gray-800">Audit LPLPO</h2>
            <p class="text-sm text-gray-500 mt-2">Bandingkan kolom selisih fisik LPLPO dan LPLPO RI secara otomatis.</p>
        </div>

        <!-- Pastikan action mengarah ke endpoint '/proses' pada file Python Anda -->
        <form action="/proses" method="post" enctype="multipart/form-data" class="space-y-5">
            
            <div class="space-y-2">
                <label for="file_excel" class="block text-sm font-semibold text-gray-700">
                    Unggah File Excel
                </label>
                <input 
                    type="file" 
                    id="file_excel" 
                    name="file_excel" 
                    accept=".xlsx" 
                    required
                    class="block w-full text-sm text-gray-600
                           file:mr-4 file:py-2 file:px-4
                           file:rounded-lg file:border-0
                           file:text-sm file:font-semibold
                           file:bg-blue-50 file:text-blue-700
                           hover:file:bg-blue-100 
                           border border-gray-200 rounded-lg p-1.5 cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <button 
                type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition duration-200 flex justify-center items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
                Proses & Unduh Hasil
            </button>

        </form>

        <div class="mt-6 border-t border-gray-100 pt-4">
            <p class="text-xs text-gray-400 text-center">
                * Pastikan file menggunakan format ekstensi <b>.xlsx</b> dan memiliki sheet "LPLPO" serta "LPLPO RI".
            </p>
        </div>

    </div>

</body>
</html>
